
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Swyx OpenStreetMap Address Search</title>

  <!-- Leaflet stylesheet -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #ffffff;
    }

    /* Search toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background: #f7f7fa;
      flex: 0 0 auto;
    }

    #query {
      flex: 1 1 180px;
      min-width: 0;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #522583;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    /* Status message */
    #status {
      flex: 0 0 auto;
      padding: 6px 12px;
      font-size: 12px;
      min-height: 26px;
      max-height: 56px;
      overflow: auto;
    }

    /* Address search results */
    #results {
      flex: 0 1 auto;
      max-height: 120px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    #results button {
      display: block;
      width: 100%;
      padding: 9px 12px;
      text-align: left;
      color: #222;
      background: white;
      border: none;
      border-bottom: 1px solid #ddd;
      border-radius: 0;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    #results button:hover {
      background: #f0eaf6;
    }

    /* Map container */
    #map {
      position: relative;
      display: block;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      background: #e5e5e5;
    }

    /* Leaflet positioning safeguards */
    .leaflet-container {
      position: relative;
      overflow: hidden;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-tile {
      width: 256px;
      height: 256px;
      max-width: none !important;
      max-height: none !important;
    }

    .leaflet-map-pane,
    .leaflet-tile-pane,
    .leaflet-overlay-pane {
      position: absolute;
    }

    /* Footer */
    .attribution {
      flex: 0 0 auto;
      padding: 4px 10px;
      font-size: 10px;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <!-- Address search -->
  <form class="toolbar" id="searchForm">
    <input
      id="query"
      type="search"
      minlength="3"
      maxlength="180"
      placeholder="Street, postcode, city or business"
      aria-label="Search address"
      required
    >

    <button id="searchButton" type="submit">
      Search
    </button>
  </form>

  <!-- Search status -->
  <div
    id="status"
    role="status"
    aria-live="polite"
  >
    Enter an address to search.
  </div>

  <!-- Search results -->
  <div id="results"></div>

  <!-- Interactive map -->
  <div
    id="map"
    aria-label="Interactive map"
  ></div>

  <!-- Attribution -->
  <div class="attribution">
    Map data © OpenStreetMap contributors.
    Search powered by Nominatim.
  </div>

  <!-- Leaflet JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>
    'use strict';

    const statusElement =
      document.getElementById('status');

    const resultsElement =
      document.getElementById('results');

    const searchButton =
      document.getElementById('searchButton');

    const searchInput =
      document.getElementById('query');

    const mapElement =
      document.getElementById('map');

    // Initialize map centered on the Netherlands.
    const map = L.map('map', {
      zoomControl: true
    }).setView([52.1326, 5.2913], 7);

    // OpenStreetMap tile layer.
    L.tileLayer(
      'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">' +
          'OpenStreetMap</a> contributors'
      }
    ).addTo(map);

    let marker = null;
    let lastRequest = 0;
    let resizeScheduled = false;

    // Refresh map size after Swyx widget resizing.
    function refreshMapSize() {
      if (
        mapElement.clientWidth === 0 ||
        mapElement.clientHeight === 0
      ) {
        return;
      }

      map.invalidateSize({
        animate: false,
        pan: false,
        debounceMoveend: true
      });
    }

    function scheduleMapRefresh() {
      if (resizeScheduled) {
        return;
      }

      resizeScheduled = true;

      requestAnimationFrame(() => {
        resizeScheduled = false;
        refreshMapSize();
      });
    }

    // Observe widget resizing.
    if (typeof ResizeObserver !== 'undefined') {
      const resizeObserver =
        new ResizeObserver(scheduleMapRefresh);

      resizeObserver.observe(mapElement);
    }

    // Browser resizing.
    window.addEventListener(
      'resize',
      scheduleMapRefresh
    );

    // Refresh after the widget becomes visible.
    document.addEventListener(
      'visibilitychange',
      () => {
        if (!document.hidden) {
          scheduleMapRefresh();
          setTimeout(refreshMapSize, 300);
        }
      }
    );

    // Delayed refreshes for embedded browsers.
    setTimeout(refreshMapSize, 250);
    setTimeout(refreshMapSize, 750);
    setTimeout(refreshMapSize, 1500);

    // Display a selected address.
    function showPlace(place) {
      const lat = Number(place.lat);
      const lon = Number(place.lon);

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
      ) {
        return;
      }

      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup(place.display_name);

      resultsElement.replaceChildren();
      statusElement.textContent =
        place.display_name;

      requestAnimationFrame(() => {
        refreshMapSize();
        map.setView([lat, lon], 16);
        marker.openPopup();
      });
    }

    // Search addresses using Nominatim.
    document.getElementById('searchForm')
      .addEventListener('submit', async (event) => {

        event.preventDefault();

        const query = searchInput.value.trim();

        if (query.length < 3) {
          return;
        }

        const wait = Math.max(
          0,
          1100 - (Date.now() - lastRequest)
        );

        searchButton.disabled = true;
        resultsElement.replaceChildren();
        statusElement.textContent = 'Searching...';

        scheduleMapRefresh();

        try {
          // Respect public Nominatim request limits.
          if (wait) {
            await new Promise(resolve =>
              setTimeout(resolve, wait)
            );
          }

          lastRequest = Date.now();

          const url = new URL(
            'https://nominatim.openstreetmap.org/search'
          );

          url.searchParams.set('q', query);
          url.searchParams.set('format', 'jsonv2');
          url.searchParams.set('limit', '5');
          url.searchParams.set('accept-language', 'en');

          const response = await fetch(
            url.toString(),
            {
              headers: {
                'Accept': 'application/json'
              }
            }
          );

          if (!response.ok) {
            throw new Error(
              'Search service returned ' +
              response.status
            );
          }

          const places = await response.json();

          if (!places.length) {
            statusElement.textContent =
              'No matching addresses found.';
            return;
          }

          statusElement.textContent =
            'Select a result:';

          for (const place of places) {
            const item =
              document.createElement('button');

            item.type = 'button';
            item.textContent =
              place.display_name;

            item.addEventListener(
              'click',
              () => showPlace(place)
            );

            resultsElement.appendChild(item);
          }

          scheduleMapRefresh();

        } catch (error) {
          statusElement.textContent =
            'Address search unavailable. ' +
            'Check network access or search service availability.';

          console.error(error);

        } finally {
          searchButton.disabled = false;
          scheduleMapRefresh();
        }
      });

    window.addEventListener(
      'load',
      scheduleMapRefresh
    );
  </script>

</body>
</html>
