<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swyx Address Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoqZ7D1oB6G6Q=" crossorigin="">
<style>html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif}body{display:flex;flex-direction:column}.toolbar{padding:12px;background:#f7f7fa;display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px;padding:10px;border:1px solid #aaa;border-radius:6px}button{padding:10px 16px;background:#522583;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}#status{padding:4px 12px;font-size:13px;min-height:20px}#results{max-height:130px;overflow:auto}#results button{display:block;width:100%;background:white;color:#222;text-align:left;border-bottom:1px solid #ddd;border-radius:0}#map{flex:1;min-height:260px}.attribution{font-size:11px;padding:4px 12px}</style></head><body>
<form class="toolbar" id="searchForm"><input id="query" type="search" minlength="3" maxlength="180" placeholder="Street, postcode, city or business" aria-label="Search address" required><button id="searchButton" type="submit">Search</button></form>
<div id="status" role="status" aria-live="polite">Enter an address to search.</div><div id="results"></div><div id="map" aria-label="Interactive map"></div>
<div class="attribution">Map data © OpenStreetMap contributors. Search powered by Nominatim.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const map=L.map('map').setView([52.1326,5.2913],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
let marker=null,lastRequest=0;
const status=document.getElementById('status'), results=document.getElementById('results'), button=document.getElementById('searchButton');
function showPlace(place){const lat=Number(place.lat),lon=Number(place.lon);if(!Number.isFinite(lat)||!Number.isFinite(lon))return;if(marker)map.removeLayer(marker);marker=L.marker([lat,lon]).addTo(map).bindPopup(document.createTextNode(place.display_name)).openPopup();map.setView([lat,lon],16);status.textContent=place.display_name;results.replaceChildren();}
document.getElementById('searchForm').addEventListener('submit',async e=>{e.preventDefault();const query=document.getElementById('query').value.trim();if(query.length<3)return;const wait=Math.max(0,1100-(Date.now()-lastRequest));button.disabled=true;results.replaceChildren();status.textContent='Searching…';try{if(wait)await new Promise(r=>setTimeout(r,wait));lastRequest=Date.now();const url=new URL('https://nominatim.openstreetmap.org/search');url.searchParams.set('q',query);url.searchParams.set('format','jsonv2');url.searchParams.set('limit','5');url.searchParams.set('accept-language','en');const response=await fetch(url.toString(),{headers:{Accept:'application/json'}});if(!response.ok)throw new Error('Search service returned '+response.status);const places=await response.json();if(!places.length){status.textContent='No matching addresses found.';return;}status.textContent='Select a result:';for(const place of places){const item=document.createElement('button');item.type='button';item.textContent=place.display_name;item.addEventListener('click',()=>showPlace(place));results.appendChild(item);} }catch(error){status.textContent='Address search unavailable. Check network access and geocoding service policy.';console.error(error);}finally{button.disabled=false;}});
</script></body></html>
